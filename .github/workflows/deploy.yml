name: TitanCore CD

on:
  workflow_run:
    workflows: ["TitanCore CI"]
    types:
      - completed

jobs:
  deploy:
    # Deploy ONLY when CI succeeded on main.
    # PR CI runs will NOT deploy to production.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}

          script: |
            set -e

            cd /opt/titancore

            echo "Pulling latest code..."
            git pull origin main

            echo "Saving current images for rollback..."

            docker tag titancore-backend:1.0 titancore-backend:previous
            docker tag titancore-frontend:1.0 titancore-frontend:previous

            rollback() {
              echo "Deployment failed. Starting rollback..."

              docker tag titancore-backend:previous titancore-backend:1.0
              docker tag titancore-frontend:previous titancore-frontend:1.0

              docker compose down --remove-orphans
              docker compose up -d

              echo "Rollback completed."
            }

            trap rollback ERR

            echo "Building new backend image..."

            docker build \
              -t titancore-backend:1.0 \
              ./backend

            echo "Building new frontend image..."

            docker build \
              --build-arg VITE_API_URL=http://178.105.30.16:5000/api \
              -t titancore-frontend:1.0 \
              ./frontend

            echo "Deploying new version..."

            docker compose down --remove-orphans
            docker compose up -d

            echo "Waiting for services..."

            sleep 5

            echo "Checking backend API..."

            curl --fail http://localhost:5000/api/projects

            echo "Checking frontend..."

            curl --fail http://localhost:3000

            echo "Deployment successful."

            docker image prune -f