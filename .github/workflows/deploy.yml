name: TitanCore CD

on:
  workflow_run:
    workflows: ["TitanCore CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/titancore

            git pull origin main

            docker build -t titancore-backend:1.0 ./backend
            docker build --build-arg VITE_API_URL=http://178.105.30.16:5000/api -t titancore-frontend:1.0 ./frontend

            docker compose up -d --force-recreate
            echo "Checking backend API..."

            sleep 5

            curl --fail http://localhost:5000/api/projects

            echo "Backend API is healthy."

            docker image prune -f