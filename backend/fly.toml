# fly.toml app configuration file generated for titancore-backend on 2026-06-05T05:42:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'titancore-backend'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
